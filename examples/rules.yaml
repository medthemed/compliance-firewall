# compliance-firewall rule database
# Rules are evaluated in priority order (highest first).
# Decision resolution: most restrictive wins (block > require_consent > redact > allow).

rules:
  - id: GDPR-ART44
    jurisdiction: EU
    description: "No PII transfer to non-adequate third countries"
    match:
      contains_pii: true
      destination_regions:
        - US
        - CN
        - RU
        - IN
    decision: block
    severity: critical
    citation: "GDPR Art. 44 — General principle for transfers"
    remediation: "Use an EU-based processor or obtain explicit consent under Art. 49(1)(a)."
    priority: 100

  - id: GDPR-ART5-MINIMIZATION
    jurisdiction: EU
    description: "Data minimisation — redact unnecessary categories from tool calls"
    match:
      action_types:
        - tool_call
      data_categories:
        - national_id
        - health
        - biometric
    decision: redact
    severity: high
    citation: "GDPR Art. 5(1)(c)"
    remediation: "Strip sensitive categories before invoking external tools."
    priority: 80

  - id: CCPA-OPTEVENT
    jurisdiction: US-CA
    description: "Email cannot be used for marketing without prior opt-in"
    match:
      data_categories:
        - email
      purposes:
        - marketing
        - advertising
    decision: require_consent
    severity: high
    citation: "CCPA §1798.120 — Right to opt-out of sale/sharing"
    remediation: "Record explicit opt-in before sending marketing communications."
    priority: 50

  - id: BASIC-REDACT-PHONE
    jurisdiction: GLOBAL
    description: "Redact phone numbers from tool call payloads"
    match:
      action_types:
        - tool_call
      data_categories:
        - phone
    decision: redact
    severity: medium
    citation: "Internal policy POL-003"
    remediation: "Strip phone fields before invoking external tools."
    priority: 10

  - id: CHINA-PIPL-LOCALIZE
    jurisdiction: CN
    description: "PII collected in China must not be exported without security assessment"
    match:
      destination_regions:
        - US
        - EU
        - IN
      contains_pii: true
    decision: block
    severity: critical
    citation: "PIPL Art. 38"
    remediation: "Complete CAC security assessment before cross-border transfer."
    priority: 90
