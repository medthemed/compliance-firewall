[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-firewall"
version = "0.1.1"
description = "Compliance proxy that intercepts agent actions and allows, blocks, or transforms them against a rule database."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "medthemed"}]
keywords = ["compliance", "gdpr", "ai-safety", "proxy", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
cf = "compliance_firewall.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
